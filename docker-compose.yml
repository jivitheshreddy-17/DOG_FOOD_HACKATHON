version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# DOGFOOD 2026 — Single-command stack
# Usage:  docker compose up
# Portal: http://localhost:8080
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ── Redis 7 (session store + rate limiting) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Fastify Backend ──────────────────────────────────────────────────────────
  # Build context is the repository root (MODULE-1_T1/) so the Dockerfile
  # can reach both backend/ sources and fixtures.json (mounted at runtime).
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://dogfood:dogfood@postgres:5432/dogfood
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      SESSION_SECRET: dogfood-hackathon-2026-secret
      # Fixtures are bind-mounted from the parent references/ directory so
      # the image stays small and the seed always uses the canonical file.
      FIXTURES_PATH: /app/fixtures.json
    volumes:
      - ../references/fixtures.json:/app/fixtures.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ── Next.js 14 Frontend ──────────────────────────────────────────────────────
  # Exposed on host port 8080 — must match .dogfood.toml base_url.
  # /api/* is rewritten to the backend (see next.config.js).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      BACKEND_URL: http://backend:3001
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "8080:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
